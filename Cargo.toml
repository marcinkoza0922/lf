[package]
name = "lf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "persistence"] }
egui_commonmark = { path = "crates/egui_commonmark", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.36.2", features = ["file", "image"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
chrono = "0.4"
regex = "1"
url = "2"
fontdb = "0.24"
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
debug_assert_with_mut_call = "warn"
large_stack_arrays = "warn"
